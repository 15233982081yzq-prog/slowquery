apiVersion: v1
kind: Service
metadata:
  annotations:
  labels:
    app: slowquery-openapi
  name: slowquery-openapi-svc-node
  namespace: smart-slow-query
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
    nodePort: 30186
    protocol: TCP
    targetPort: 12345
  selector:
    app: slowquery-openapi
  sessionAffinity: None
  type: NodePort