apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowquery-alert
  namespace: smart-slow-query
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slowquery-alert
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: slowquery-alert
    spec:
      containers:
        - image: harbor.shopeemobile.com/rds-kube-operator/slowquery-alert:v1.3.5
          imagePullPolicy: Always
          name: alert
          command:
            - "/etc/slowquery/slowquery-alert"
            - "--config=/etc/conf/config.live.toml"
          ports:
            - containerPort: 8098
              name: grpc
              protocol: TCP
          env:
            - name: ENV
              value: "live"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 800m
              memory: 800Mi
          volumeMounts:
            - name: config
              mountPath: /etc/conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: slowquery-alert-config
        - name: tmp
          hostPath:
            path: /data/log/alert_log
            type: DirectoryOrCreate
      restartPolicy: Always
---
