apiVersion: v1
kind: ConfigMap
metadata:
  name: db-daily-report-template
  namespace: default
data:
  db_report_template.html: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <title>SLOW QUERY DAILY REPORT</title>
    </head>
      <body>
        <h2>DBAAS SLOW QUERY DB DAILY RANK TOP 10:</h2>
        <h3 color="red">live环境-platform测试邮件-内部测试期一周通过后正式发送给各产品线L2负责人</h3>
        <table border="1">
          <tr>
            <th scope="col">rank_no</th>
            <th scope="col">cluster_uuid</th>
            <th scope="col">db_name</th>
            <th scope="col">cmdb</th>
            <th scope="col">productLine</th>
            <th scope="col">owner</th>
            <th scope="col">leaders</th>
            <th scope="col">total_query_time(s)</th>
            <th scope="col">count</th>
            <th scope="col">week-on-week</th>
            <th scope="col">detail_link</th>
          </tr>
          {{ range .}}
          <tr>
            <td align="center"> {{ .SerialNo }} </td>
            <td align="center"> {{ .ClusterUUID }} </td>
            <td align="center"> {{ .DBName }} </td>
            <td align="center"> {{ .OwnCMDB }}</td>
            <td align="center"> {{ .ProductLine }}</td>
            <td align="center"> {{ .Owner }}</td>
            <td align="center"> {{ .Leaders }}</td>
            <td align="center"> {{ .Total }} </td>
            <td align="center"> {{ .Count }} </td>
            <td align="center"> {{ .WeekOnWeek }} </td>
            <td align="center"> <a href="{{ .DetailLink }}"> detail </a> </td>
          </tr>
          {{ end }}
        </table>
      </body>
    </html>

