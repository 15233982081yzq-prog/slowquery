apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowquery-platform
  namespace: slow-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slowquery-platform
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: slowquery-platform
    spec:
      containers:
        - image: harbor.shopeemobile.com/rds-kube-operator/slowquery-platform:v1.3.10
          imagePullPolicy: Always
          name: platform
          command:
            - "/etc/slowquery/slowquery-platform"
            - "--config=/etc/slowquery/config/slowquery-platform.toml"
          ports:
            - containerPort: 8098
              name: grpc
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 200Mi
          volumeMounts:
            - name: config
              mountPath: /etc/slowquery/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: slowquery-platform-config
        - name: tmp
          hostPath:
            path: /data/log/slow_query
            type: DirectoryOrCreate
      restartPolicy: Always
---
