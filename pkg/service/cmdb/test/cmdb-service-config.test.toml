
# ============================================
# Server meta
# ============================================
server_name = "dml-server"

server_env = "test"

# log_level {all,debug,info,warn,error,fatal}"
log_level = "all"

listen_port = 8090

gin_mode = "debug"


# ======================
# Server Log config
# ======================
[server_log]
log_name = "dml"
log_level = "info"
log_path = "/tmp/dml_log"
log_max_file_size = 200 #单位:MB
log_max_backups = 10
log_max_age = 10
log_compress = true

# ======================
# space
# ======================
[space]
space_host = "https://space.test.shopee.io"
user = "db_dml"
pass = "db_dml@shopee.com"

