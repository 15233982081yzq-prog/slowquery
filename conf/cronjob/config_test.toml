# ============================================
# Server meta
# ============================================
server_name = "slow-query-cronjob"

server_env = "test"

# log_level {all,debug,info,warn,error,fatal}"
log_level = "all"

gin_mode = "debug"

# ======================
# clickhouse Config
# ======================
[clickhouse_client_config]
driver = "clickhouse"
host = "127.0.0.1"
port = 8123
user = "root"
password = "123456"
db_name = "szinfra_clouddba_slow_query_test"
max_idle_conn = 10
max_open_conn = 30
max_life_time = "60s"

# ======================
# Cron Log config
# ======================
[cron_log_config]
log_name = "platform"
log_level = "info"
log_path = "/tmp/slow-query_log"
log_max_file_size = 500 #单位:MB
log_max_backups = 10
log_max_age = 10
log_compress = true

# ======================
# space config
# ======================
[space_config]
space_host = "https://space.test.shopee.io"
user = "smart_slow_query"
pass = "smart_slow_query@shopee.com"

# ======================
# cmdb_database config
# ======================
[cmdb_database_config]
space = "https://space.test.shopee.io"
path = "/apis/cmdb/v2/service/get_dbameta_dbs_details"
http_method = "GET"
client_timeout = "5s"

# ======================
# MySQL Config
# ======================
[db_config]
username = "sz_infra_test"
password = "TnOa9kDGlnb_T9cIhg8w"
host = "master.585e6d8af19775e6.mysql.cloud.test.shopee.io"
port = 6606
db_name = "shopee_exec_meta_db"
log_mode = true
connect_timeout = 20
max_idle_conns = 10
max_open_conns = 50
error_retry = 3

# ======================
# local cache
# ======================
[local_cache]
shards = 1024
expire_time = "10m"
clean_time = "3m"
max_cache_size = 1024 #MB

